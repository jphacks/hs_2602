<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHIKAI</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<style>
/* Apple(iOS / iPadOS)風。白のほかは黒・青・紫の3色だけ(グレーは黒を薄めたもの、紫は AI 参加者)。参加者のアイコンだけは色分けする */
:root {
  color-scheme: light;
  --bg: #ffffff; --tile: #ffffff; --tile-2: rgba(0, 0, 0, 0.04); --fill: rgba(0, 0, 0, 0.05); --fill-2: rgba(0, 0, 0, 0.09);
  --line: rgba(0, 0, 0, 0.1); --line-strong: rgba(0, 0, 0, 0.16);
  --text: #000000; --muted: rgba(0, 0, 0, 0.55); --faint: rgba(0, 0, 0, 0.3);
  --accent: #007aff; --accent-soft: rgba(0, 122, 255, 0.1);
  --ai: #af52de; --ai-soft: rgba(175, 82, 222, 0.1);
  --material: rgba(255, 255, 255, 0.8); --shadow: none;
  --radius: 22px; --radius-sm: 12px; --gap: 16px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --num: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -.01em;
  background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.screen { display: none; min-height: 100vh; animation: fade .4s cubic-bezier(.2,.8,.2,1) both; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 共通 ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .06em; }
/* アプリアイコン風: 角の丸い正方形 + 上からのグラデーション + 白い記号 */
.purpose .icon, .avatar, .msg .av, .mic {
  background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); }
.brand-mark { width: 30px; height: 30px; display: block; }
.btn { border: 0; background: var(--fill); padding: 10px 18px; border-radius: 999px; color: var(--accent);
  font-weight: 600; transition: background .2s, transform .1s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; }
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--text); }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn svg { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  background: var(--fill); color: var(--muted); white-space: nowrap; }
.chip:empty { display: none; }
.chip.warn { color: var(--accent); background: var(--accent-soft); }
.glass, .tile { background: var(--tile); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
.tile { padding: 20px 22px; min-width: 0; }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); max-width: 980px; margin: 0 auto; padding: 28px 24px 56px; }
.span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; }
/* 見出し: iOS のラージタイトル(カードにせず背景の上に置く) */
.tile-hero { background: transparent; box-shadow: none !important; padding: 8px 4px 4px; display: flex; flex-direction: column; gap: 10px; }
.tile-hero h1 { margin: 0; font-size: clamp(30px, 3.6vw, 40px); line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mode-pill { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); }
.tile-steps { display: grid; place-items: center; }
.steps-v { display: flex; flex-direction: column; gap: 8px; color: var(--faint); font-weight: 600; font-size: 14px; }
.steps-v span { display: flex; align-items: center; gap: 10px; }
.steps-v i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--rounded);
  font-size: 13px; background: var(--fill); }
.steps-v .on { color: var(--text); } .steps-v .on i { background: var(--accent); color: #fff; }

/* ---------- 1. モード選択 ---------- */
.eyebrow { color: var(--accent); font-weight: 600; font-size: 13px; }
.bento-mode { margin-top: 4vh; }
.bento-mode .tile-steps { background: transparent; box-shadow: none; }
.purpose { position: relative; text-align: left; padding: 24px; min-height: 220px; border: 0;
  display: flex; flex-direction: column; transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
.purpose:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,.08); }
.purpose:active { transform: scale(.98); }
.purpose .icon { width: 64px; height: 64px; border-radius: 15px; display: grid; place-items: center; margin-bottom: auto;
  background-color: var(--text); color: #fff; }
.purpose.general .icon { background-color: var(--ai); }
.purpose .icon svg { width: 34px; height: 34px; }
.purpose h2 { margin: 26px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.purpose .sub { color: var(--muted); margin-top: 2px; }
.purpose .go { position: absolute; right: 22px; top: 22px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); color: var(--muted); transition: .2s; }
.purpose:hover .go { background: var(--accent); color: #fff; }

/* ---------- 2. 設定 ---------- */
.bento-setup { align-items: start; }
.tile > .label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.input { width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--fill); border: 0;
  outline: none; transition: box-shadow .2s; }
.input::placeholder { color: var(--faint); }
.input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
/* セグメンテッドコントロール */
.seg { display: inline-flex; padding: 2px; gap: 0; border-radius: 9px; background: var(--fill); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 7px; color: var(--text); font-weight: 500; font-size: 13.5px; transition: .2s; }
.seg button.on { background: var(--tile); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
.seg button:disabled { opacity: .3; cursor: not-allowed; }
.people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.person-in { position: relative; }
.person-in .dot { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; }
.person-in .input { padding-left: 34px; }
.advanced { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .45s ease, opacity .3s, margin .3s; }
.advanced.open { max-height: 1000px; opacity: 1; margin-top: 8px; }
.adv-inner h3 { margin: 18px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.toggles { display: flex; flex-direction: column; margin-top: 8px; border-radius: var(--radius-sm); background: var(--tile-2); overflow: hidden; }
.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: 15px; cursor: pointer; }
.toggle + .toggle { border-top: .5px solid var(--line); }
.toggle input { accent-color: var(--accent); width: 18px; height: 18px; }
.theme-row { display: flex; gap: 10px; }
.theme-row .btn { flex: none; }
/* ステッパー: − 値 + の一体型 + 直接入力の欄 */
.numrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stepper2 { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; width: 200px; height: 44px; border-radius: var(--radius-sm); background: var(--fill); overflow: hidden; }
.stepper2 button { height: 100%; border: 0; background: transparent; color: var(--accent); font-size: 22px; font-weight: 500; }
.stepper2 button:hover { background: var(--fill); }
.stepper2 button:disabled { color: var(--faint); pointer-events: none; }
.stepper2 output { text-align: center; font-family: var(--rounded); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.unitbox { display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 44px; border-radius: var(--radius-sm); background: var(--fill); }
.unitbox input { width: 48px; background: transparent; border: 0; outline: none; text-align: right; font-family: var(--rounded); font-size: 17px; }
.unitbox span { color: var(--muted); }
.choice2, .choice3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 11px; background: var(--fill); }
.choice3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice2 button, .choice3 button { padding: 10px 6px; border-radius: 9px; border: 0; background: transparent; font-weight: 500; font-size: 15px; transition: .2s; }
.choice3 button small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.choice2 button.on, .choice3 button.on { background: var(--tile); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
.detail-head { display: flex !important; align-items: center; justify-content: space-between; cursor: pointer; }
/* iOS のスイッチ */
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--fill-2); transition: .25s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: .25s cubic-bezier(.2,.8,.2,1); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
/* 詳細: 設定アプリのリストのように区切り線で並べる */
.knob { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; font-size: 15px; flex-wrap: wrap; }
#knobs .knob + .knob { border-top: .5px solid var(--line); }
.setup-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.setup-actions .btn { padding: 14px 24px; font-size: 16px; }
.err { color: var(--text); font-weight: 600; font-size: 13.5px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 6px; }

/* ---------- 3. 進行 ---------- */
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 20px;
  background: var(--material); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--line); }
.bar .theme { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .chips { display: flex; gap: 6px; }
.bar .actions { display: flex; gap: 8px; }
.stage { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--gap); padding: var(--gap); height: calc(100vh - 61px); }
.left { display: grid; grid-template-rows: auto 1fr; gap: var(--gap); min-height: 0; }
.clock { padding: 26px 30px 22px; position: relative; overflow: hidden; }
.clock .lab { color: var(--muted); font-size: 13px; font-weight: 600; }
.clock .time { font-family: var(--rounded); font-weight: 600; font-size: clamp(64px, 9vw, 108px); line-height: 1; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.clock .limit { color: var(--muted); font-size: 16px; }
.clock .limit b { color: var(--text); font-family: var(--rounded); }
.clock.low .time, .clock.over .time { color: var(--accent); }
.progress { height: 6px; border-radius: 999px; background: var(--fill); margin: 20px 0 16px; overflow: hidden; }
.progress div { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width .6s; }
.phases { display: flex; gap: 6px; flex-wrap: wrap; }
.phases span { font-size: 12.5px; font-weight: 500; padding: 4px 12px; border-radius: 999px; color: var(--faint); background: var(--fill); }
.phases span.done { color: var(--muted); }
.phases span.now { color: #fff; background: var(--accent); font-weight: 600; }
.phases span.target { color: var(--accent); background: transparent; box-shadow: inset 0 0 0 1px var(--accent); }
/* Siri のような丸いオーブ */
@keyframes ripple { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
/* 参加者カード: 同じ幅で始まり、発言量に応じて幅が伸び縮みする(高さは一定) */
.people-row { display: flex; gap: var(--gap); min-height: 0; align-items: stretch; }
.pcard { background: color-mix(in srgb, var(--c) 10%, #fff); box-shadow: none; flex: 1 1 0; min-width: 84px; padding: 22px 14px 18px; position: relative; text-align: center; overflow: hidden;
  transition: flex-grow .8s cubic-bezier(.2,.8,.2,1), box-shadow .3s, transform .3s; }
.pcard .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pcard.active { box-shadow: inset 0 0 0 2px var(--c); transform: translateY(-2px); }
/* 参加者のアイコン: アプリアイコン風の角の丸い正方形(大きさは固定) */
.avatar { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 15px; display: grid; place-items: center;
  font-weight: 700; font-size: 26px; font-family: var(--rounded); color: #fff; background-color: var(--c); position: relative;
}
.pcard.active .avatar::after { content: ""; position: absolute; inset: -6px; border-radius: 20px; border: 2px solid var(--accent); animation: ripple-box 1.4s ease-out infinite; }
@keyframes ripple-box { from { opacity: .9; } to { inset: -13px; opacity: 0; } }
.pcard .name { font-weight: 600; font-size: 17px; }
.badges { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--muted); }
.badge.ai { color: var(--ai); background: var(--ai-soft); }
.pcard.bot .avatar svg { width: 32px; height: 32px; }
/* 会話ログ: メッセージアプリ風の吹き出し */
.logbox { display: flex; flex-direction: column; min-height: 0; padding: 18px 18px 14px; }
.logbox .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.logbox .head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.log { flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.log::-webkit-scrollbar { width: 6px; } .log::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 6px; }
.msg { display: grid; grid-template-columns: 30px 1fr; gap: 8px; animation: fade .3s ease both; }
.msg .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background-color: var(--c, #8e8e93); }
.msg .av svg { width: 18px; height: 18px; }
.msg .who { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; padding-left: 12px; }
.msg .who select { background: transparent; border: 0; color: var(--muted); font-weight: 600; font-size: 12px; padding: 0; cursor: pointer; }
.msg .who select:hover { color: var(--accent); }
.msg .who time { color: var(--faint); font-variant-numeric: tabular-nums; }
.msg .bubble { justify-self: start; max-width: 100%; margin-top: 2px; padding: 8px 14px; border-radius: 18px; font-size: 15px;
  background: color-mix(in srgb, var(--c, #8e8e93) 13%, #fff); }
.msg .aitag { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 6px; color: var(--ai); background: var(--ai-soft); }
.msg.ai { --c: #8e8e93; }
.msg.ai .av { background-color: var(--c); }
.msg.ai .who b { color: var(--text); }
.msg .low { color: var(--accent); font-size: 11px; }
.partial { color: var(--muted); font-style: italic; min-height: 22px; padding: 6px 4px 0; font-size: 14px; }
.composer { display: flex; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: .5px solid var(--line); }
.composer select { background: var(--fill); border: 0; border-radius: 999px; padding: 0 12px; }
.composer .input { padding: 10px 16px; border-radius: 999px; }
.empty { color: var(--faint); text-align: center; margin: auto; font-size: 15px; }

/* オーバーレイ・ドロワー */
.overlay { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(255,255,255,.6); padding: 20px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.overlay.show { display: grid; animation: fade .3s ease both; }
.modal { width: min(480px, 100%); padding: 32px 28px; text-align: center; border-radius: 28px; box-shadow: inset 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.12) !important; }
.modal h2 { margin: 14px 0 6px; font-size: 24px; font-weight: 700; }
.modal p { color: var(--muted); margin: 0 0 18px; }
.mic { width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; position: relative; background-color: var(--accent); color: #fff; }
.mic svg { width: 36px; height: 36px; }
.mic::before, .mic::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--accent); animation: ripple 1.8s ease-out infinite; }
.mic::after { animation-delay: .9s; }
.enrolled { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.enrolled span { font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--fill); color: var(--muted); }
.enrolled span.ok { color: var(--accent); background: var(--accent-soft); }
.enrolled span.now { color: #fff; background: var(--accent); }
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 24px; }
.summary-grid div { padding: 14px; border-radius: 16px; background: var(--tile-2); }
.summary-grid b { display: block; font-family: var(--rounded); font-size: 26px; }
.summary-grid span { color: var(--muted); font-size: 12.5px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hidden { display: none !important; }

/* ---------- スマホの縦画面に合わせた1列のレイアウト(PC でも中央に同じ幅で表示) ---------- */
body { font-size: 17px; }
:root { --gap: 12px; --col: 440px; }
.screen { max-width: var(--col); margin: 0 auto; }
.bento { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 40px; }
.bento > * { grid-column: 1 / -1 !important; }
.tile-steps { display: none; }
.bento-mode .brand { font-size: 26px; gap: 14px; letter-spacing: .08em; }
.bento-mode .brand-mark { width: 60px; height: 60px; }
.bento-mode { margin-top: 0; padding-top: 6vh; }
.tile { padding: 18px 16px; }
.purpose { min-height: 180px; padding: 20px; }
.purpose .sub { font-size: 16px; }
.tile > .label { font-size: 15px; }
.input { font-size: 17px; padding: 14px 16px; }
.people { grid-template-columns: 1fr; }
.theme-row { flex-direction: column; }
.theme-row .btn, .setup-actions .btn { justify-content: center; font-size: 17px; padding: 14px; }
.numrow { flex-wrap: nowrap; }
.stepper2 { flex: 1; width: auto; height: 50px; grid-template-columns: 54px 1fr 54px; }
.stepper2 button { font-size: 26px; }
.stepper2 output { font-size: 22px; }
.unitbox { height: 50px; } .unitbox input { font-size: 20px; }
.choice2 button, .choice3 button { font-size: 17px; padding: 13px 4px; }
.choice3 button small { font-size: 13px; }
.hint, .err { font-size: 15px; }
.knob { font-size: 16px; flex-direction: column; align-items: stretch; gap: 8px; }
.knob .seg { display: grid; grid-template-columns: repeat(3, 1fr); }
.knob .seg button { font-size: 15px; padding: 8px 4px; }
#seg-input { grid-template-columns: 1fr 1fr; }
.toggle { font-size: 17px; padding: 14px 16px; }
.toggle input { width: 22px; height: 22px; }
.setup-actions { flex-direction: column-reverse; align-items: stretch; gap: 10px; }
/* 進行画面: 上から バー → 時計 → 参加者 → 会話ログ */
.bar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
.bar .theme { flex: 1 1 100%; }
.bar .chips { display: none; }
.bar .actions { flex: 1 1 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 6px; }
.bar .actions .btn { justify-content: center; padding: 9px 8px; font-size: 14px; gap: 4px; }
.stage { grid-template-columns: 1fr; height: auto; padding: var(--gap) 16px 24px; }
.clock { padding: 20px 20px 18px; }
.clock .time { font-size: 72px; }
.people-row { flex-wrap: wrap; } .pcard { flex-basis: 40%; }
.logbox { min-height: 70vh; }
.composer select { flex: none; max-width: 96px; }
.composer .input { flex: 1; min-width: 0; }
/* ---------- 進行画面だけはスマホの横持ち(画面の高さに収め、左に時計と参加者、右に会話ログ) ---------- */
#s-session { max-width: 1180px; }
#s-session.active { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
#s-session .bar { position: static; flex-wrap: nowrap; gap: 10px; padding: 8px 14px; }
#s-session .bar .theme { flex: 1 1 auto; font-size: 15px; }
#s-session .bar .actions { flex: none; display: flex; gap: 6px; }
#s-session .bar .actions .btn { padding: 7px 11px; font-size: 13px; }
#s-session .stage { flex: 1; min-height: 0; height: auto; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px; padding: 10px 14px 12px; }
#s-session .left { grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
#s-session .clock { padding: 12px 16px 12px; }
#s-session .clock .lab { display: none; }
#s-session .clock .time { font-size: 46px; margin: 0; display: inline-block; vertical-align: baseline; }
#s-session .clock .limit { display: inline-block; margin-left: 10px; font-size: 14px; }
#s-session .progress { margin: 8px 0 8px; height: 5px; }
#s-session .phases span { font-size: 11px; padding: 2px 9px; }
#s-session .people-row { flex-wrap: nowrap; gap: 8px; }
#s-session .pcard { flex-basis: 0; min-width: 64px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#s-session .avatar { width: 46px; height: 46px; border-radius: 12px; font-size: 20px; margin-bottom: 6px; }
#s-session .pcard.active .avatar::after { border-radius: 16px; }
#s-session .pcard.bot .avatar svg { width: 24px; height: 24px; }
#s-session .pcard .name { font-size: 14px; }
#s-session .badges { top: 6px; right: 6px; }
#s-session .badge { font-size: 9.5px; padding: 1px 6px; }
#s-session .logbox { min-height: 0; padding: 12px 12px 10px; }
#s-session .logbox .head { margin-bottom: 8px; }
#s-session .logbox .head h2 { font-size: 16px; }
#s-session .msg .bubble { font-size: 14px; padding: 7px 12px; }
#s-session .composer { margin-top: 8px; padding-top: 8px; }
#s-session .composer .input, #s-session .composer select { font-size: 14px; }
#s-session .composer .input { padding: 8px 14px; }
#s-session .composer .btn { padding: 8px 14px; }
.rotate-hint { display: none; }
/* 縦向きのスマホでは横向きにするよう案内する */
@media (orientation: portrait) and (max-width: 700px) {
  #s-session .rotate-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; position: fixed; inset: 0; z-index: 20;
    background: var(--bg); color: var(--muted); font-size: 17px; }
  #s-session .rotate-hint svg { width: 56px; height: 56px; color: var(--text); }
  #s-session .rotate-hint b { color: var(--text); }
}
/* 時計はタップで経過時間と残り時間を入れ替える */
.clock { cursor: pointer; user-select: none; -webkit-user-select: none; }
.clock .limit .dot-sep { margin: 0 8px; color: var(--faint); }
#s-session .clock .lab { display: block; font-size: 11.5px; margin-bottom: 2px; }
/* 会話ログはタップで画面いっぱいに広げる */
.logbox { cursor: zoom-in; }
.logbox .head-r { display: flex; align-items: center; gap: 8px; }
.logbox .zoom { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--muted); }
.logbox .zoom svg { width: 14px; height: 14px; }
.logbox.expanded { position: fixed; inset: 8px; z-index: 15; cursor: zoom-out; box-shadow: inset 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.15) !important; }
.logbox.expanded .zoom svg { transform: rotate(180deg); }
#s-session .logbox.expanded .head h2 { font-size: 20px; }
#s-session .logbox.expanded .msg .bubble { font-size: 17px; padding: 9px 15px; }
#s-session .logbox.expanded .msg .who { font-size: 13px; }
/* 議論タイプ: 2列。数が奇数のときは先頭(指定なし)を横いっぱいに */
.type-grid button:first-child:nth-last-child(odd) { grid-column: 1 / -1; }
.type-grid button { font-size: 15px !important; }
</style>
</head>
<body>

<!-- ============ 1. モード選択 ============ -->
<section class="screen" id="s-purpose">
  <div class="bento bento-mode">
    <div class="tile tile-hero span-3">
      <div class="brand"><img class="brand-mark" src="/icon.svg" alt="">SHIKAI</div>
      <h1>モード選択</h1>
    </div>
    <div class="tile tile-steps">
      <div class="steps-v"><span class="on"><i>1</i>モード</span><span><i>2</i>設定</span><span><i>3</i>進行</span></div>
    </div>
    <button class="tile purpose span-2" data-mode="human">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.8 14.2c2.5-.3 4.3 1.3 4.8 4.3"/></svg></div>
      <h2>人間だけ</h2>
      <div class="sub">参加者は全員人間</div>
      <span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </button>
    <button class="tile purpose general span-2" data-mode="ai">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 16h5"/></svg></div>
      <h2>AI参加者あり</h2>
      <div class="sub">AI も参加者として議論に加わる</div>
      <span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </button>
  </div>
</section>

<!-- ============ 2. 設定 ============ -->
<section class="screen" id="s-setup">
  <form class="bento bento-setup" id="setup-form" autocomplete="off">
    <div class="tile tile-hero span-4">
      <div class="hero-row">
        <h1>ディスカッションの設定</h1>
        <span class="mode-pill" id="mode-label">人間だけ</span>
      </div>
    </div>

    <div class="tile span-4">
      <label class="label" for="f-theme">テーマ</label>
      <div class="theme-row">
        <input class="input" id="f-theme" placeholder="例：大学の学食の混雑を改善するには？">
        <button type="button" class="btn primary" id="btn-theme">自動生成</button>
      </div>
    </div>

    <div class="tile span-2">
      <span class="label">制限時間</span>
      <div class="numrow" data-key="minutes" data-min="1" data-max="60" data-unit="分"></div>
    </div>

    <div class="tile span-2">
      <span class="label">参加者の人数</span>
      <div class="numrow" data-key="humans" data-min="1" data-max="4" data-unit="人"></div>
    </div>

    <div class="tile span-4">
      <span class="label">名前</span>
      <div class="people" id="people"></div>
    </div>

    <div class="tile tile-ai span-2 ai-only">
      <span class="label">AI参加者</span>
      <div class="numrow" data-key="bots" data-min="1" data-max="3" data-unit="人"></div>
    </div>

    <div class="tile tile-ai span-2 ai-only">
      <span class="label">AI参加者のレベル</span>
      <div class="choice3" id="seg-level">
        <button type="button" data-v="1">やさしい</button>
        <button type="button" data-v="2">ふつう</button>
        <button type="button" data-v="3">むずかしい</button>
      </div>
    </div>

    <div class="tile span-2 tile-style">
      <span class="label">スタイル</span>
      <div class="choice2" id="purpose">
        <button type="button" data-v="job">就活</button>
        <button type="button" data-v="general">就活以外</button>
      </div>
    </div>

    <div class="tile span-4">
      <span class="label">議論タイプ<span id="type-req">(必須)</span></span>
      <div class="choice2 type-grid" id="seg-type"></div>
      <div class="hint" id="type-hint"></div>
    </div>

    <div class="tile span-2 detail" id="detail-tile">
      <label class="detail-head">
        <span class="label" style="margin:0">詳細</span>
        <span class="switch"><input type="checkbox" id="f-detail"><i></i></span>
      </label>
      <div class="advanced" id="detail-body">
          <div class="adv-inner">
            <div id="knobs"></div>
            <h3 style="margin-top:22px">その他</h3>
            <div class="knob"><span>入力方法</span><div class="seg" id="seg-input"><button type="button" data-v="voice">🎙 音声</button><button type="button" data-v="text">⌨ テキスト</button></div></div>
            <div class="hint" id="mode-hint" style="margin:-4px 0 10px"></div>
            <div class="toggles">
              <label class="toggle"><input type="checkbox" id="f-intro" checked>自己紹介で声を登録</label>
              <label class="toggle"><input type="checkbox" id="f-tts" checked>AI の声を出す</label>
              <label class="toggle"><input type="checkbox" id="f-spk" checked>話者情報を使う</label>
            </div>
          </div>
        </div>
    </div>

    <div class="setup-actions span-4">
      <button type="button" class="btn" id="back-purpose">← モード選択に戻る</button>
      <span class="err" id="f-err"></span>
      <button type="submit" class="btn primary">準備完了 →</button>
    </div>
  </form>
</section>

<!-- ============ 3. 進行 ============ -->
<section class="screen" id="s-session">
  <div class="rotate-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M2 12a10 10 0 0 0 4 8M20 4l2 2-2 2"/></svg>
    <b>スマホを横向きにしてください</b>
  </div>
  <div class="bar">
    <div class="theme" id="b-theme">—</div>
    <div class="chips"><span class="chip" id="b-purpose"></span><span class="chip" id="b-type"></span><span class="chip" id="b-preset"></span><span class="chip" id="b-level"></span><span class="chip" id="b-llm"></span></div>
    <div class="actions">
      <button class="btn primary" id="btn-start"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>開始</button>
      <button class="btn" id="btn-pause" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span>一時停止</span></button>
      <button class="btn danger" id="btn-stop" disabled><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>終了</button>
      <button class="btn" id="btn-setup" title="設定に戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
  </div>
  <div class="stage">
    <div class="left">
      <div class="glass clock" id="clock" title="タップで経過時間と残り時間を入れ替え">
        <div class="lab" id="c-big-lab">経過時間</div>
        <div class="time" id="c-time">00:00</div>
        <div class="limit"><span id="c-small-lab">残り</span> <b id="c-remain">--:--</b><span class="dot-sep">·</span>制限時間 <b id="c-limit">8</b> 分</div>
        <div class="progress"><div id="c-bar"></div></div>
        <div class="phases" id="phases"></div>
      </div>
      <div class="people-row" id="pcards"></div>
    </div>
    <div class="glass logbox" id="logbox" title="タップで大きく表示">
      <div class="head"><h2>会話ログ</h2><span class="head-r"><span class="chip" id="silence"></span><span class="zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></span></span></div>
      <div class="log" id="log"><div class="empty">発言がここに表示されます</div></div>
      <div class="partial" id="partial"></div>
      <div class="composer">
        <select id="in-speaker"></select>
        <input class="input" id="in-text" placeholder="テキストで発言を追加(Enter で送信)">
        <button class="btn" id="btn-send">送信</button>
      </div>
    </div>
  </div>
</section>

<!-- 自己紹介 -->
<div class="overlay" id="ov-intro">
  <div class="glass modal">
    <div class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <h2 id="intro-title">自己紹介</h2>
    <p>名前と一言を、5秒ほど話してください。AI が声を覚えます。</p>
    <div class="enrolled" id="intro-list"></div>
  </div>
</div>

<!-- 終了 -->
<div class="overlay" id="ov-done">
  <div class="glass modal">
    <div class="eyebrow">SESSION COMPLETE</div>
    <h2>お疲れさまでした</h2>
    <p id="done-theme"></p>
    <div class="summary-grid">
      <div><b id="d-time">--:--</b><span>経過時間</span></div>
      <div><b id="d-utts">0</b><span>発言数</span></div>
      <div><b id="d-ai">0</b><span>AIの介入</span></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="d-close">ログを見る</button>
      <button class="btn primary" id="d-new">新しく始める</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ["#007aff", "#ff2d55", "#ff9500", "#34c759"];
const AI_COLORS = ["#af52de", "#5856d6", "#32ade6"];
const ROBOT = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 16h5"/></svg>';
let PHASES = [];  // 議論タイプのフェーズ [key, 名前]。サーバーの状態(s.phases)から受け取る
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).then((r) => r.json());

const ui = {
  withAI: false, purpose: "job", dtype: null, minutes: 8, humans: 3, bots: 1, input: "voice", level: 2,
  knobs: { phase: 1, redirect: 1, organize: 1, turns: 1, suggest: 1 }, info: null, config: null, started: false,
};
let snap = null, logKey = "", doneShown = false;

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

/* ---------- 1. モード選択 ---------- */
document.querySelectorAll(".purpose").forEach((b) => b.onclick = () => {
  ui.withAI = b.dataset.mode === "ai";
  $("mode-label").textContent = ui.withAI ? "AI参加者あり" : "人間だけ";
  syncSetup();
  show("s-setup");
});

/* ---------- 2. 設定 ---------- */
const LEVEL_NAMES = { 1: "やさしい", 2: "ふつう", 3: "むずかしい" };
const KNOB_LEVELS = ["控えめ", "標準", "積極的"];
$("people").innerHTML = [0, 1, 2, 3].map((i) => `<div class="person-in"><span class="dot" style="background:${COLORS[i]}"></span>
  <input class="input f-name" placeholder="${i + 1}人目"></div>`).join("");

// 数値の入力(− 値 ＋ と、直接入力できる「○分/○人」の枠)
document.querySelectorAll(".numrow").forEach((row) => {
  row.innerHTML = `<div class="stepper2"><button type="button">−</button><output></output><button type="button">＋</button></div>
    <label class="unitbox"><input type="number" min="${row.dataset.min}" max="${row.dataset.max}"><span>${row.dataset.unit}</span></label>`;
  const [minus, plus] = row.querySelectorAll("button"), key = row.dataset.key;
  const clamp = (v) => Math.min(+row.dataset.max, Math.max(+row.dataset.min, Math.round(v) || +row.dataset.min));
  minus.onclick = () => { ui[key] = clamp(ui[key] - 1); syncSetup(); };
  plus.onclick = () => { ui[key] = clamp(ui[key] + 1); syncSetup(); };
  row.querySelector("input").onchange = (e) => { ui[key] = clamp(+e.target.value); syncSetup(); };
});
function seg(id, key, after) {
  $(id).querySelectorAll("button").forEach((b) => b.onclick = () => {
    if (b.disabled) return;
    ui[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; syncSetup(); after && after();
  });
}
seg("purpose", "purpose", () => {
  if (ui.purpose === "job" && !ui.dtype) ui.dtype = null;          // 就活GDは毎回選ぶ
  if (ui.purpose === "general" && ui.dtype == null) ui.dtype = "";  // 就活以外は「指定なし(汎用)」が初期値
  renderTypes();
});
// 議論タイプ: 就活GDは4種類から必須。就活以外は「指定なし(汎用)」も選べる
const GENERIC_TYPE = { key: "", label: "指定なし(汎用)", phases: ["案出し", "比較検討", "結論"] };
function typeOptions() {
  const types = ui.info?.discussion_types || [];
  return ui.purpose === "general" ? [GENERIC_TYPE, ...types] : types;
}
function typeLabel(key) {
  const t = [GENERIC_TYPE, ...(ui.info?.discussion_types || [])].find((x) => x.key === (key || ""));
  return t ? (t.key ? t.label : "汎用型") : "";
}
function renderTypes() {
  const opts = typeOptions();
  $("seg-type").innerHTML = opts.map((t) => `<button type="button" data-v="${esc(t.key)}" class="${t.key === ui.dtype ? "on" : ""}">${esc(t.label)}</button>`).join("");
  $("seg-type").querySelectorAll("button").forEach((b) => b.onclick = () => { ui.dtype = b.dataset.v; renderTypes(); });
  const cur = opts.find((t) => t.key === ui.dtype);
  $("type-hint").textContent = cur ? cur.phases.join(" → ") : "テーマに合う進め方を選んでください";
  $("type-req").style.display = ui.purpose === "job" ? "" : "none";
}
seg("seg-input", "input");
seg("seg-level", "level");
$("f-detail").onchange = (e) => { $("detail-body").classList.toggle("open", e.target.checked); };

function renderKnobs() {
  const labels = ui.info?.knobs || {};
  $("knobs").innerHTML = Object.entries(labels).map(([k, label]) => `<div class="knob"><span>${esc(label)}</span>
    <div class="seg" data-knob="${k}">${KNOB_LEVELS.map((t, i) => `<button type="button" data-v="${i}">${t}</button>`).join("")}</div></div>`).join("")
    + '<div class="hint" id="knob-hint"></div>';
  $("knobs").querySelectorAll(".seg").forEach((g) => g.querySelectorAll("button").forEach((b) => b.onclick = () => {
    if (b.disabled) return;
    ui.knobs[g.dataset.knob] = +b.dataset.v; syncSetup();
  }));
}
function syncSetup() {
  document.querySelectorAll(".numrow").forEach((row) => {
    const v = ui[row.dataset.key], [minus, plus] = row.querySelectorAll("button");
    row.querySelector("output").textContent = v;
    row.querySelector("input").value = v;
    minus.disabled = v <= +row.dataset.min; plus.disabled = v >= +row.dataset.max;
  });
  document.querySelectorAll(".person-in").forEach((el, i) => el.classList.toggle("hidden", i >= ui.humans));
  document.querySelectorAll(".ai-only").forEach((el) => el.classList.toggle("hidden", !ui.withAI));
  const on = (id, v) => $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", String(v) === b.dataset.v));
  on("purpose", ui.purpose); on("seg-input", ui.input); on("seg-level", ui.level);
  // 就活では選考の公平性のため、AI が参加者の出していない観点を持ち込まない(提案度合いは標準まで)
  const jobCap = ui.purpose === "job";
  if (jobCap && ui.knobs.suggest > 1) ui.knobs.suggest = 1;
  $("knobs").querySelectorAll(".seg").forEach((g) => g.querySelectorAll("button").forEach((b) => {
    b.classList.toggle("on", +b.dataset.v === (ui.knobs[g.dataset.knob] ?? 1));
    b.disabled = jobCap && g.dataset.knob === "suggest" && +b.dataset.v === 2;
  }));
  if ($("knob-hint")) $("knob-hint").textContent = jobCap ? "就活では提案度合いは標準までです" : "";
  $("mode-hint").textContent = ui.input === "voice"
    ? "マイクで聞き取ります" : "発言を入力します";
}
$("btn-theme").onclick = async () => {
  const b = $("btn-theme"); b.disabled = true; b.textContent = "生成中…";
  try {
    const res = await fetch("/api/theme", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ purpose: ui.purpose, exclude: $("f-theme").value.trim() }) });
    if (!res.ok) throw new Error(res.status);
    const r = await res.json();
    if (r.theme) { $("f-theme").value = r.theme; $("f-err").textContent = ""; }
  } catch (e) {
    $("f-err").textContent = "テーマを生成できませんでした(サーバーを再起動してください)";
  } finally { b.disabled = false; b.textContent = "自動生成"; }
};
$("back-purpose").onclick = () => show("s-purpose");

$("setup-form").onsubmit = (ev) => {
  ev.preventDefault();
  const names = [...document.querySelectorAll(".f-name")].slice(0, ui.humans).map((e) => e.value.trim());
  if (!$("f-theme").value.trim()) { $("f-err").textContent = "テーマを入力するか、自動生成してください"; return; }
  if (ui.purpose === "job" && !ui.dtype) { $("f-err").textContent = "議論タイプを選択してください"; return; }
  if (names.some((n) => !n)) { $("f-err").textContent = `参加者の名前を${ui.humans}人分入力してください`; return; }
  const bots = ui.withAI ? ui.bots : 0;
  if (names.length + bots < 2) { $("f-err").textContent = "合計2人以上にしてください(AI参加者ありモードなら AI を加えられます)"; return; }
  $("f-err").textContent = "";
  ui.config = {
    theme: $("f-theme").value.trim(), minutes: ui.minutes, names, mode: ui.input,
    intro: $("f-intro").checked, tts: $("f-tts").checked, use_speaker_info: $("f-spk").checked,
    purpose: ui.purpose, preset: "A", custom: {}, discussion_type: ui.dtype || null, ai_count: bots, ai_level: ui.level, knobs: { ...ui.knobs },
  };
  snap = null; logKey = ""; doneShown = false; ui.started = false;
  renderReady();
  show("s-session");
};

/* ---------- 3. 進行 ---------- */
// 参加者の一覧(人間 + AI 参加者)。開始前は設定から、開始後はサーバーの状態から作る
function people() {
  if (snap && snap.names) {
    const bots = Object.fromEntries((snap.participants || []).map((p) => [p.id, p]));
    return Object.entries(snap.names).map(([id, name]) => ({ id, name, bot: bots[id] || null }));
  }
  const c = ui.config || { names: [], ai_count: 0 };
  const list = c.names.map((n, i) => ({ id: `speaker_${i + 1}`, name: n, bot: null }));
  for (let j = 0; j < (c.ai_count || 0); j++) list.push({ id: `speaker_${c.names.length + j + 1}`, name: `AI 参加者 ${j + 1}`, bot: { stance: "開始時に立場を生成", opinion: "" } });
  return list;
}
function names() { return Object.fromEntries(people().map((p) => [p.id, p.name])); }
function humanIds() { return people().filter((p) => !p.bot).map((p) => p.id); }
function color(sid) {
  const ps = people(), bi = ps.filter((p) => p.bot).findIndex((p) => p.id === sid);
  if (bi >= 0) return AI_COLORS[bi % AI_COLORS.length];
  const i = +String(sid).split("_")[1] - 1; return COLORS[i] || "#8e8e93";
}
function llmChip(llm) {
  const mock = llm === "mock";
  $("b-llm").textContent = mock ? "モックAI(トークン消費なし)" : String(llm || "").replace("anthropic:", "");
  $("b-llm").classList.toggle("warn", mock);
}

function renderReady() {
  const c = ui.config;
  $("b-theme").textContent = c.theme;
  $("b-purpose").textContent = c.purpose === "general" ? "就活以外" : "就活";
  $("b-type").textContent = typeLabel(c.discussion_type);
  $("b-preset").textContent = c.ai_count ? "AI参加者あり" : "人間だけ";
  $("b-level").textContent = c.ai_count ? `AI ${LEVEL_NAMES[c.ai_level] || ""}` : "";
  llmChip(ui.info?.llm);
  $("c-limit").textContent = c.minutes; showClock(0, c.minutes * 60);
  $("c-bar").style.width = "0"; $("clock").classList.remove("low", "over");
  $("btn-start").disabled = false; $("btn-pause").disabled = true; $("btn-stop").disabled = true;

  $("log").innerHTML = '<div class="empty">発言がここに表示されます</div>'; $("partial").textContent = ""; $("silence").textContent = "";
  renderPhases("", "");
  $("pcards").dataset.key = "";
  renderPeople();
  $("in-speaker").innerHTML = people().filter((p) => !p.bot).map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
}

// phase: 実際のフェーズ(AI の判断、塗り)/ target: 経過時間から見た目標フェーズ(点線)
function renderPhases(phase, target) {
  const idx = PHASES.findIndex(([k]) => k === phase);
  $("phases").innerHTML = PHASES.map(([k, ja], i) => {
    const cls = i === idx ? "now" : k === target ? "target" : i < idx ? "done" : "";
    const tip = (i === idx ? "現在のフェーズ(AIの判断)" : "") + (k === target ? " 目標フェーズ(経過時間から)" : "");
    return `<span class="${cls}" title="${tip.trim()}">${esc(ja)}</span>`;
  }).join("");
}

function cardGrow(sec, sum, n) {
  // カードの幅の比率。発言時間の割合が平均(1/n)なら1(開始時と同じ幅)、多いほど広く(最大4倍)、少ないほど狭く(0.5倍)。
  // 最初の数発言で極端な差がつかないよう、発言の合計が 90 秒に達するまでは差を割り引く(開始時は全員同じ大きさ)
  if (!sum) return 1;
  const r = (sec / sum) * n;
  const target = Math.min(4, Math.max(0.5, Math.pow(r, 0.8)));
  return 1 + (target - 1) * Math.min(1, sum / 90);
}

// 時計: 既定は経過時間を大きく、残り時間を小さく表示する。タップで入れ替える
function showClock(elapsed, remaining) {
  ui.clock = { elapsed, remaining };
  const big = ui.swapClock ? remaining : elapsed, small = ui.swapClock ? elapsed : remaining;
  $("c-big-lab").textContent = ui.swapClock ? "残り時間" : "経過時間";
  $("c-small-lab").textContent = ui.swapClock ? "経過" : "残り";
  $("c-time").textContent = (big < 0 ? "-" : "") + mmss(Math.abs(big));
  $("c-remain").textContent = (small < 0 ? "-" : "") + mmss(Math.abs(small));
}
$("clock").onclick = () => { ui.swapClock = !ui.swapClock; if (ui.clock) showClock(ui.clock.elapsed, ui.clock.remaining); };

// 会話ログ: タップで画面いっぱいに広げる / 戻す(発言者の選択や入力欄の操作は除く)
$("logbox").onclick = (e) => {
  if (e.target.closest("select, input, button, .composer")) return;
  if (window.getSelection && String(window.getSelection())) return;
  $("logbox").classList.toggle("expanded");
};

function renderPeople() {
  const ps = people(), n = names(), ids = ps.map((p) => p.id), botOf = Object.fromEntries(ps.map((p) => [p.id, p.bot]));
  const box = $("pcards");
  const key = JSON.stringify(ps.map((p) => [p.id, p.name, p.bot?.stance || "", p.bot?.opinion || ""]));
  if (box.dataset.key !== key) {
    // 参加者の顔ぶれが変わったときだけカードを作り直す(幅のアニメーションを途切れさせないため)
    box.innerHTML = ids.map((id) => {
      const bot = botOf[id];
      return `<div class="glass pcard ${bot ? "bot" : ""}" data-id="${id}" style="--c:${color(id)}">
        <div class="badges"></div>
        <div class="avatar">${bot ? ROBOT : esc(n[id].slice(0, 1))}</div>
        <div class="name">${esc(n[id])}</div>
      </div>`;
    }).join("");
    box.dataset.key = key;
  }
  const stats = Object.fromEntries((snap?.stats || []).map((s) => [s.speaker_id, s]));
  const sum = Object.values(stats).reduce((a, s) => a + s.total_speech_sec, 0);
  const enrolled = new Set(snap?.intro?.enrolled || []);
  box.querySelectorAll(".pcard").forEach((card) => {
    const id = card.dataset.id, bot = botOf[id];
    const s = stats[id] || { total_speech_sec: 0, turns: 0, since_last_spoke_sec: null };
    card.classList.toggle("active", snap?.active_speaker === id);
    card.querySelector(".badges").innerHTML = (bot ? '<span class="badge ai">AI</span>' : "")
      + (enrolled.has(n[id]) ? '<span class="badge voice">声 ✓</span>' : "");
    card.style.flexGrow = cardGrow(s.total_speech_sec, snap?.started ? sum : 0, ids.length).toFixed(3);
  });
}

function render() {
  const s = snap; if (!s || !s.theme) return;
  const running = s.status === "running" || s.status === "intro";
  $("b-theme").textContent = s.theme;
  $("b-purpose").textContent = s.purpose === "general" ? "就活以外" : "就活";
  $("b-type").textContent = s.discussion_type || "";
  $("b-preset").textContent = (s.participants || []).length ? "AI参加者あり" : "人間だけ";
  $("b-level").textContent = s.ai_level ? `AI ${LEVEL_NAMES[s.ai_level] || ""}` : "";
  llmChip(s.llm);

  // 時計
  $("c-limit").textContent = +(s.duration / 60).toFixed(1);
  showClock(s.elapsed, s.started ? s.remaining : s.duration);
  $("c-bar").style.width = `${Math.min(100, (s.elapsed / s.duration) * 100)}%`;
  $("clock").classList.toggle("low", s.started && s.remaining <= 60 && s.remaining > 0);
  $("clock").classList.toggle("over", s.started && s.remaining <= 0);
  if (s.phases) PHASES = s.phases;
  renderPhases(s.phase, s.status === "finished" ? "" : s.target_phase);

  // ボタン
  $("btn-start").disabled = running || s.status === "finished";
  $("btn-pause").disabled = s.status !== "running";
  $("btn-pause").querySelector("span").textContent = s.paused ? "再開" : "一時停止";
  $("btn-stop").disabled = !running;

  $("silence").textContent = s.mode === "voice" ? (s.speaking ? "● 発話中" : `沈黙 ${Math.floor(s.silence)}秒`) : "テキスト入力";

  renderPeople();
  renderLog(s);
  $("partial").textContent = s.partial ? `… ${s.partial}` : "";

  // 自己紹介
  $("ov-intro").classList.toggle("show", s.status === "intro" && !!s.intro.current);
  if (s.status === "intro") {
    $("intro-title").textContent = s.intro.current ? `${s.intro.current}さん、どうぞ` : "自己紹介";
    $("intro-list").innerHTML = (s.humans || Object.keys(s.names)).map((id) => s.names[id]).map((n) => `<span class="${s.intro.enrolled.includes(n) ? "ok" : n === s.intro.current ? "now" : ""}">${s.intro.enrolled.includes(n) ? "✓ " : ""}${esc(n)}</span>`).join("");
  }
  // 終了
  if (s.status === "finished" && s.started && !doneShown) {
    doneShown = true;
    $("done-theme").textContent = s.theme;
    $("d-time").textContent = mmss(s.elapsed);
    $("d-utts").textContent = s.utterances.filter((u) => u.source === "human").length;
    $("d-ai").textContent = s.interventions;
    $("ov-done").classList.add("show");
  }
}

function renderLog(s) {
  const key = JSON.stringify(s.utterances.map((u) => [u.id, u.speaker_id, u.text]));
  if (key === logKey || document.activeElement?.classList?.contains("relabel")) return;
  logKey = key;
  const box = $("log"); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  if (!s.utterances.length) { box.innerHTML = '<div class="empty">発言がここに表示されます</div>'; return; }
  const humans = new Set(s.humans || Object.keys(s.names));
  const opts = (sel) => Object.entries(s.names).filter(([id]) => humans.has(id)).map(([id, n]) => `<option value="${id}" ${id === sel ? "selected" : ""}>${esc(n)}</option>`).join("")
    + `<option value="unknown" ${sel === "unknown" ? "selected" : ""}>不明</option>`;
  box.innerHTML = s.utterances.map((u) => u.source === "ai"
    ? `<div class="msg ai"><div class="av">AI</div><div><div class="who"><b>AI ファシリテーター</b><time>${mmss(u.t)}</time></div><div class="bubble">${esc(u.text)}</div></div></div>`
    : u.source === "bot"
    ? `<div class="msg bot" style="--c:${color(u.speaker_id)}"><div class="av">${ROBOT}</div>
       <div><div class="who"><b>${esc(s.names[u.speaker_id] || "AI")}</b><span class="aitag">AI参加者</span><time>${mmss(u.t)}</time></div><div class="bubble">${esc(u.text)}</div></div></div>`
    : `<div class="msg" style="--c:${u.speaker_id === "unknown" ? "#c7c7cc" : color(u.speaker_id)}"><div class="av">${esc((s.names[u.speaker_id] || "?").slice(0, 1))}</div>
       <div><div class="who"><select class="relabel" data-id="${u.id}" title="話者を修正">${opts(u.speaker_id)}</select><time>${mmss(u.t)}</time>
       ${u.conf < 0.7 && u.speaker_id !== "unknown" ? '<span class="low">低確信</span>' : ""}</div><div class="bubble">${esc(u.text)}</div></div></div>`).join("");
  box.querySelectorAll(".relabel").forEach((el) => el.onchange = () => { post("/api/relabel", { id: +el.dataset.id, speaker_id: el.value }); el.blur(); });
  if (atBottom) box.scrollTop = box.scrollHeight;
}

$("btn-start").onclick = async () => {
  if (!ui.config) return show("s-setup");
  $("btn-start").disabled = true;
  const r = await post("/api/start", ui.config);
  if (!r.ok) { $("btn-start").disabled = false; alert(r.error); return; }
  ui.started = true; doneShown = false;
};
$("btn-pause").onclick = () => post(snap?.paused ? "/api/resume" : "/api/pause");
$("btn-stop").onclick = () => { if (confirm("ディスカッションを終了しますか？")) post("/api/stop"); };
$("btn-setup").onclick = () => {
  const live = snap && (snap.status === "running" || snap.status === "intro");
  if (live && !confirm("進行中のセッションを終了して設定に戻りますか？")) return;
  if (live) post("/api/stop");
  ui.started = false; show("s-setup");
};
$("d-close").onclick = () => $("ov-done").classList.remove("show");
$("d-new").onclick = () => { $("ov-done").classList.remove("show"); ui.started = false; show("s-purpose"); };
const send = () => {
  const text = $("in-text").value.trim(); if (!text) return;
  post("/api/text", { speaker_id: $("in-speaker").value, text }); $("in-text").value = "";
};
$("btn-send").onclick = send;
$("in-text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) send(); });

/* ---------- 起動 ---------- */
fetch("/api/info").then((r) => r.json()).then((info) => {
  ui.info = info; ui.input = info.default_mode; renderKnobs(); renderTypes(); syncSetup();
});
let first = true;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const s = JSON.parse(ev.data);
    if (first) {
      first = false;
      if (s.status === "running" || s.status === "intro") {  // 再読み込み時は進行画面に戻る
        ui.config = { theme: s.theme, minutes: s.duration / 60, names: (s.humans || []).map((id) => s.names[id]), ai_count: (s.participants || []).length, purpose: s.purpose, preset: s.preset, discussion_type: s.discussion_type_key };
        ui.started = true; snap = s; renderReady(); show("s-session");
      } else show("s-purpose");
    }
    // 進行画面で「開始」を押したあとのセッションだけを表示する(前回のセッションの残りは出さない)
    if (!$("s-session").classList.contains("active") || !ui.started || !s.theme) return;
    snap = s; render();
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
