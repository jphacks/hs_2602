id: 12_backtrack
title: 評価・比較の途中で原因分析に戻る(一時的な言及との区別)
theme: 大学の学食の混雑を改善するには？
duration_sec: 600
start_elapsed: 300
initial_phase: evaluation
participants: {speaker_1: たろう, speaker_2: はなこ, speaker_3: けんた, speaker_4: みさき}
utterances:
  - {t: 300, d: 5, s: speaker_1, c: 0.9, text: キャッシュレスレジとモバイルオーダー、効果で比べるとどうですか。}
  - {t: 306, d: 5, s: speaker_2, c: 0.88, text: 効果はモバイルオーダーの方が大きいと思います。並ばなくていいので。}
  - {t: 312, d: 6, s: speaker_3, c: 0.9, text: ただ、さっき原因に挙げた会計の遅さには、キャッシュレスレジの方が直接効きますよね。}
  - {t: 319, d: 5, s: speaker_4, c: 0.86, text: 確かに。コストもキャッシュレスレジの方が安いですし。}
  - {t: 330, d: 6, s: speaker_1, c: 0.9, text: でも待ってください。そもそも混雑の一番の原因って、会計じゃなくて席が空かないことじゃないですか？}
  - {t: 337, d: 5, s: speaker_2, c: 0.88, text: あ、それはあるかも。食べ終わっても座ってる人、多いですよね。}
  - {t: 343, d: 6, s: speaker_3, c: 0.9, text: じゃあ原因をもう一回整理し直しましょうか。会計と席の回転、どっちが大きいか。}
  - {t: 350, d: 5, s: speaker_4, c: 0.86, text: 昼のピークに席が満席で、トレーを持って待ってる人をよく見ます。}
  - {t: 356, d: 5, s: speaker_1, c: 0.9, text: それなら席の回転の方が大きい原因かもしれないですね。}
checkpoints:
  - {at: 326, expect: [no_intervention], require_llm: true, expect_phase: [evaluation], why: 以前の原因(会計の遅さ)に触れたのは案を比べる根拠としてで、主な目的は評価・比較のまま。順調なので見守る}
  - {at: 363, expect: [no_intervention], require_llm: true, expect_phase: [cause_analysis], why: 原因を整理し直すことに参加者が合意し、主な目的が原因分析に戻った。自分たちで進めているので見守る}
