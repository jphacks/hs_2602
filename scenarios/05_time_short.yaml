  - {t: 474, d: 3, s: speaker_4, c: 0.87, text: でも優先順位はつけたほうがいいですよね。}
  - {t: 490, d: 5, s: speaker_1, c: 0.9, text: じゃあ、すぐできる順にキャッシュレスレジと空き教室を最優先にしましょう。}
  - {t: 496, d: 4, s: speaker_2, c: 0.86, text: 賛成です。モバイルオーダーは長期的な案ということで。}
  - {t: 501, d: 4, s: speaker_3, c: 0.88, text: 理由は、コストが低くてすぐ実行できるから、でいいですかね。}
  - {t: 506, d: 2, s: speaker_4, c: 0.87, text: はい、それで結論にしましょう。}
  - {t: 515, d: 4, s: speaker_1, c: 0.9, text: 発表するときは、原因、対策、優先順位の順で話しましょう。}
  - {t: 525, d: 2, s: speaker_2, c: 0.86, text: 誰が発表しますか？}
  - {t: 529, d: 2, s: speaker_3, c: 0.88, text: たろうさんお願いできますか？}
  - {t: 533, d: 1, s: speaker_1, c: 0.9, text: わかりました。}
  - {t: 540, d: 4, s: speaker_4, c: 0.87, text: 一応、原因の整理のところをもう一回確認しておきましょうか。}
  - {t: 545, d: 4, s: speaker_1, c: 0.9, text: 時間の集中、会計の遅さ、席の回転、の3つですね。}
  - {t: 550, d: 4, s: speaker_2, c: 0.86, text: 対策もそれぞれに対応してるので、筋は通ってますね。}
